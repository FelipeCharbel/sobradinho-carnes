services:
  - type: web
    name: sobradinho-carnes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sobradinho-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: sobradinho-db
    databaseName: sobradinho
    user: sobradinho_user
    plan: free
